name: Foundation validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.6'
      - name: Unit and regression tests with branch coverage
        run: |
          python -m pip install coverage==7.10.6
          python -m coverage run --branch --source=bin -m unittest discover -s tests -p 'test_*.py' -v
          python -m coverage report --show-missing --fail-under=90
      - name: Workflow compilation, input validation and fixture harmonization
        run: python -m unittest discover -s tests -p test_nextflow.py -v
      - name: Diff whitespace
        run: git diff --check
